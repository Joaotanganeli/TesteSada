<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste SADA - Gestão de Tarefas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-content">
      <h1>Teste SADA <span>Gestão de Tarefas</span></h1>
      <a class="link" href="/swagger" target="_blank" rel="noopener">Documentação da API (Swagger)</a>
    </div>
  </header>

  <main class="container layout">
    <!-- Formulário de criação / edição -->
    <section class="card">
      <h2 id="form-title">Nova tarefa</h2>
      <form id="task-form" novalidate>
        <input type="hidden" id="task-id" />

        <label for="title">Título *</label>
        <input id="title" name="title" type="text" maxlength="200" required placeholder="Ex.: Estudar EF Core" />

        <label for="description">Descrição</label>
        <textarea id="description" name="description" maxlength="1000" rows="4" placeholder="Detalhes da tarefa (opcional)"></textarea>

        <div class="row">
          <div>
            <label for="dueDate">Data de vencimento</label>
            <input id="dueDate" name="dueDate" type="date" />
          </div>
          <div>
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="Pendente">Pendente</option>
              <option value="EmProgresso">Em progresso</option>
              <option value="Concluida">Concluída</option>
            </select>
          </div>
        </div>

        <ul id="form-errors" class="errors" hidden></ul>

        <div class="actions">
          <button type="submit" class="btn primary" id="submit-btn">Criar tarefa</button>
          <button type="button" class="btn" id="cancel-btn" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <!-- Filtros + listagem -->
    <section class="card">
      <h2>Tarefas</h2>
      <form id="filter-form" class="filters">
        <div>
          <label for="filter-status">Status</label>
          <select id="filter-status">
            <option value="">Todos</option>
            <option value="Pendente">Pendente</option>
            <option value="EmProgresso">Em progresso</option>
            <option value="Concluida">Concluída</option>
          </select>
        </div>
        <div>
          <label for="filter-from">Vencimento de</label>
          <input id="filter-from" type="date" />
        </div>
        <div>
          <label for="filter-to">Vencimento até</label>
          <input id="filter-to" type="date" />
        </div>
        <div class="filter-actions">
          <button type="submit" class="btn primary">Filtrar</button>
          <button type="button" class="btn" id="clear-filters">Limpar</button>
        </div>
      </form>

      <p id="list-info" class="muted"></p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
